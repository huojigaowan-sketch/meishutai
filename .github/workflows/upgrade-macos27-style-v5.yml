name: Upgrade macOS 27 style library and reliability V5

on:
  push:
    branches: [upgrade/macos27-style-tree-reliability-v5]
    paths:
      - '.github/workflows/upgrade-macos27-style-v5.yml'
      - 'script/upgrade_v5.py'
      - 'script/run_upgrade_v5.py'
      - '美术台/**'
      - '美术台Tests/**'
      - '美术台.xcodeproj/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: meishutai-v5-upgrade
  cancel-in-progress: true

jobs:
  upgrade-build-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: upgrade/macos27-style-tree-reliability-v5

      - name: Show beta toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Apply deterministic V5 migration
        run: python3 script/run_upgrade_v5.py

      - name: Validate generated source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'sampleMedia:' '美术台/Models/ImportedStylePromptCatalog.swift')" -eq 56
          if grep -R "recommendedStyleCards" '美术台'; then
            echo 'Automatic style matching must remain removed.' >&2
            exit 1
          fi
          grep -q 'MACOSX_DEPLOYMENT_TARGET = 27.0;' '美术台.xcodeproj/project.pbxproj'
          grep -q 'SWIFT_VERSION = 6.0;' '美术台.xcodeproj/project.pbxproj'
          grep -q 'productionThreshold = 0.92' '美术台/Services/AssetReliabilityV4.swift'

      - name: Build macOS 27 application without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/meishutai-v5-build.log

      - name: Run unit tests on hosted macOS 26 compatibility host
        shell: bash
        run: |
          set -o pipefail
          # The hosted Xcode 27 image currently runs macOS 26.5.2. Override only
          # the test build's runtime floor so pure unit tests can execute; the
          # committed application target remains macOS 27.0 and is built above.
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee /tmp/meishutai-v5-tests.log

      - name: Commit verified V5 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm '.github/workflows/upgrade-macos27-style-v5.yml'
          rm 'script/upgrade_v5.py'
          rm 'script/run_upgrade_v5.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add visual style branches and reliability V4 on macOS 27'
          git push origin HEAD:upgrade/macos27-style-tree-reliability-v5
