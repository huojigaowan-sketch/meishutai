name: Upgrade V6 subject-style separation

on:
  push:
    branches: [upgrade/style-only-asset-design-v6]
    paths:
      - '.github/workflows/upgrade-v6-subject-style.yml'
      - 'script/upgrade_v6.py'
      - '美术台/**'
      - '美术台Tests/**'
      - '美术台.xcodeproj/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: meishutai-v6-subject-style
  cancel-in-progress: true

jobs:
  build-test-commit:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: upgrade/style-only-asset-design-v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Validate migration script
        run: python3 -m py_compile script/upgrade_v6.py

      - name: Apply V6 migration
        run: python3 script/upgrade_v6.py

      - name: Validate generated source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'schemaVersion: 6' '美术台/Models/ArtDepartmentV2Models.swift'
          grep -q 'private static let upstreamCards' '美术台/Models/ImportedStylePromptCatalog.swift'
          grep -q 'purifiedBuiltInCard' '美术台/Models/ImportedStylePromptCatalog.swift'
          grep -q 'AssetDesignReadiness.isReady' '美术台/Services/AssetReliabilityV4.swift'
          grep -q 'Style samples are preview-only' '美术台/Stores/ArtDepartmentV2Store.swift'
          grep -q '资产设计层——唯一主体来源' '美术台/Services/ArtDepartmentV2Pipeline.swift'
          grep -q 'GenerationReferencePolicy.shouldSendToProvider(.userContentReference)' '美术台/Stores/ArtDepartmentV2Store.swift'
          if grep -R 'recommendedStyleCards' '美术台'; then
            echo 'Automatic style matching must remain removed.' >&2
            exit 1
          fi

      - name: Build macOS 27 application without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/meishutai-v6-build.log

      - name: Run unit tests on hosted macOS compatibility host
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee /tmp/meishutai-v6-tests.log

      - name: Commit verified V6 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm '.github/workflows/upgrade-v6-subject-style.yml'
          rm 'script/upgrade_v6.py'
          rm -rf 'script/__pycache__'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: separate screenplay asset design from pure visual style'
          git push origin HEAD:upgrade/style-only-asset-design-v6
