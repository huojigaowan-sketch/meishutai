name: Manual style selection and encrypted vault migration

on:
  push:
    branches: [feature/art-department-v2]
    paths:
      - .github/workflows/manual-style-vault.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/art-department-v2

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Reassemble and apply the reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/style-vault-patch/part-* > /tmp/apply_manual_style_vault.py.gz.b64
          echo 'c7708647e7333303ebb6985b5d6bd96128723d90a6a4af9ee2c993dd3ca83cc8  /tmp/apply_manual_style_vault.py.gz.b64' | shasum -a 256 -c -
          base64 --decode -i /tmp/apply_manual_style_vault.py.gz.b64 | gzip -dc > /tmp/apply_manual_style_vault.py
          echo 'a8ba25a7d29266ad05db8f66c5ba88f75c9ce64ddac40497269d087351045505  /tmp/apply_manual_style_vault.py' | shasum -a 256 -c -
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_manual_style_vault.py')
          text = path.read_text()
          old_files = '''UPSTREAM_FILES = [
              ("references/chinese-aesthetic.json", ".scene", "东方审美"),
              ("references/comic-storyboard.json", ".camera", "漫画分镜"),
              ("references/game-asset.json", ".prop", "游戏资产"),
              ("references/info-long-image.json", ".general", "信息长图"),
              ("references/logo-design.json", ".general", "标志设计"),
              ("references/profile-avatar.json", ".character", "人物头像"),
              ("references/product-poster.json", ".prop", "产品海报"),
              ("references/ui-interface.json", ".general", "界面设计"),
          ]'''
          new_files = '''UPSTREAM_FILES = [
              ("references/app-web-design.json", ".general", "应用与网页设计"),
              ("references/comic-storyboard.json", ".camera", "漫画分镜"),
              ("references/ecommerce-main-image.json", ".prop", "电商主图"),
              ("references/game-asset.json", ".prop", "游戏资产"),
              ("references/infographic-edu-visual.json", ".general", "信息图与教育视觉"),
              ("references/others.json", ".general", "综合视觉"),
              ("references/poster-flyer.json", ".scene", "海报与传单"),
              ("references/profile-avatar.json", ".character", "人物头像"),
          ]'''
          old_extractor = '''def extract_prompt_objects(value: object) -> list[dict[str, object]]:
              values: list[dict[str, object]] = []
              if isinstance(value, list):
                  for item in value:
                      values.extend(extract_prompt_objects(item))
              elif isinstance(value, dict):
                  prompt = value.get("prompt")
                  if isinstance(prompt, str) and prompt.strip():
                      values.append(value)
                  else:
                      for item in value.values():
                          values.extend(extract_prompt_objects(item))
              return values
          '''
          new_extractor = '''def extract_prompt_objects(value: object) -> list[dict[str, object]]:
              values: list[dict[str, object]] = []
              if isinstance(value, list):
                  for item in value:
                      values.extend(extract_prompt_objects(item))
              elif isinstance(value, dict):
                  prompt = value.get("prompt")
                  if not isinstance(prompt, str) or not prompt.strip():
                      prompt = value.get("content")
                  if isinstance(prompt, str) and prompt.strip():
                      normalized = dict(value)
                      normalized["prompt"] = prompt
                      values.append(normalized)
                  else:
                      for item in value.values():
                          values.extend(extract_prompt_objects(item))
              return values
          '''
          old_view = '''    replace_once(path, "    let imageURL: URL?\\n", "    let image: NSImage?\\n")
              replace_once(
                  path,
                  "                if let imageURL, let image = NSImage(contentsOf: imageURL) {\\n                    Image(nsImage: image).resizable().scaledToFill()\\n",
                  "                if let image {\\n                    Image(nsImage: image).resizable().scaledToFill()\\n",
              )'''
          new_view = '''    replace_once(
                  path,
                  "private struct StyleCardView: View {\\n    let card: StylePromptCard\\n    let imageURL: URL?\\n",
                  "private struct StyleCardView: View {\\n    let card: StylePromptCard\\n    let image: NSImage?\\n",
              )
              replace_once(
                  path,
                  "                RoundedRectangle(cornerRadius: 12).fill(Color.primary.opacity(0.04))\\n                if let imageURL, let image = NSImage(contentsOf: imageURL) {\\n                    Image(nsImage: image).resizable().scaledToFill()\\n",
                  "                RoundedRectangle(cornerRadius: 12).fill(Color.primary.opacity(0.04))\\n                if let image {\\n                    Image(nsImage: image).resizable().scaledToFill()\\n",
              )'''
          anchors = [(old_files, new_files), (old_extractor, new_extractor), (old_view, new_view)]
          if any(text.count(old) != 1 for old, _ in anchors):
              raise SystemExit('reviewed migration anchor mismatch')
          for old, new in anchors:
              text = text.replace(old, new)
          path.write_text(text)
          PY
          echo 'ae5ff8bf79de0af3e6fbc88ee703f75ff0e207ef8b8f4af24351e72fa58cf579  /tmp/apply_manual_style_vault.py' | shasum -a 256 -c -
          python3 /tmp/apply_manual_style_vault.py
          rm /tmp/apply_manual_style_vault.py /tmp/apply_manual_style_vault.py.gz.b64

      - name: Assert manual-only style contract and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --include='*.swift' --include='*.md' 'recommendedStyleCards' 美术台 美术台Tests docs README.md
          ! grep -R -n --include='*.swift' --include='*.md' '自动匹配' 美术台 美术台Tests docs README.md
          ! grep -R -n --include='*.swift' --include='*.md' '自动推荐' 美术台 美术台Tests docs README.md
          test "$(grep -c 'StylePromptCard(' 美术台/Models/ImportedStylePromptCatalog.swift)" = "56"
          grep -q '7c065c2b429bc75334239965768849cb00c8987d' 美术台/Models/ImportedStylePromptCatalog.swift
          grep -q 'AES.GCM' 美术台/Services/ArtDepartmentV2Persistence.swift
          grep -q 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly' 美术台/Services/ArtDepartmentV2Clients.swift
          git diff --check

      - name: Build application without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/meishutai-manual-style-build.log

      - name: Run unit tests without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee /tmp/meishutai-manual-style-tests.log

      - name: Commit verified production changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/manual-style-vault.yml
          rm -rf .github/style-vault-patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: require manual styles and encrypt the style library'
          git push origin HEAD:feature/art-department-v2
