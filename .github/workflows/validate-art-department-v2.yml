name: Validate Art Department V2 refactor

on:
  push:
    branches: [feature/art-department-v2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse V2 Swift sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '美术台/Models/ArtDepartmentV2Models.swift'
            '美术台/Services/ArtDepartmentV2Persistence.swift'
            '美术台/Services/ArtDepartmentV2Clients.swift'
            '美术台/Services/ArtDepartmentV2Pipeline.swift'
            '美术台/Stores/ArtDepartmentV2Store.swift'
            '美术台/Views/ArtDepartmentV2Views.swift'
            '美术台/Views/ArtDepartmentV2SettingsView.swift'
            '美术台/ContentView.swift'
            '美术台/App/MyApp.swift'
            '美术台Tests/ArtDepartmentV2Tests.swift'
          )
          for file in "${files[@]}"; do
            swiftc -frontend -parse "$file"
          done
      - name: Validate architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SourceUnitBuilder' '美术台/Services/ArtDepartmentV2Pipeline.swift'
          grep -q 'FinalDraftFDXExporter' '美术台/Services/ArtDepartmentV2Persistence.swift'
          grep -q 'exact' 'docs/EXTRACTION_ACCURACY_CONTRACT.md' || true
          grep -q 'ArkImageGenerationClient' '美术台/Services/ArtDepartmentV2Clients.swift'
          grep -q 'ArtDepartmentV2RootView' '美术台/ContentView.swift'
          grep -q '风格提示词库' README.md
          git diff --check HEAD^ HEAD
