name: Finalize Art Department V2 refactor

on:
  push:
    branches: [feature/art-department-v2]
    paths: [.github/workflows/finalize-art-department-v2.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/art-department-v2
          fetch-depth: 0

      - name: Apply integration fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          ui = Path('美术台/Views/ArtDepartmentV2Views.swift')
          text = ui.read_text()
          text = text.replace('List(selection: $store.selectedSection) {', 'List {', 1)
          text = text.replace(
          '''Label(section.rawValue, systemImage: section.systemImage)
                            .tag(section)''',
          '''Button {
                            store.selectedSection = section
                        } label: {
                            Label(section.rawValue, systemImage: section.systemImage)
                                .foregroundStyle(store.selectedSection == section ? .primary : .secondary)
                        }
                        .buttonStyle(.plain)''', 1)
          ui.write_text(text)

          client = Path('美术台/Services/ArtDepartmentV2Clients.swift')
          text = client.read_text()
          text = text.replace(
          '''        var body: [String: Any] = [
            "model": recipe.model.isEmpty ? configuration.model : recipe.model,
            "prompt": prompt,
            "size": recipe.size,
            "response_format": "b64_json",
            "watermark": recipe.watermark,
        ]
        if !negativePrompt.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
            body["negative_prompt"] = negativePrompt
        }''',
          '''        let cleanNegative = negativePrompt.trimmingCharacters(in: .whitespacesAndNewlines)
        let resolvedPrompt = cleanNegative.isEmpty
            ? prompt
            : prompt + "\\n\\n必须避免：" + cleanNegative
        var body: [String: Any] = [
            "model": recipe.model.isEmpty ? configuration.model : recipe.model,
            "prompt": resolvedPrompt,
            "size": recipe.size,
            "response_format": "b64_json",
            "watermark": recipe.watermark,
        ]''', 1)
          client.write_text(text)

          store = Path('美术台/Stores/ArtDepartmentV2Store.swift')
          text = store.read_text()
          text = text.replace(
          '''    var selectedAsset: ProductionAsset? {
        guard let selectedAssetID else { return filteredAssets.first }
        return currentProject?.assets.first { $0.id == selectedAssetID }
    }''',
          '''    var selectedAsset: ProductionAsset? {
        guard let selectedAssetID,
              let selected = currentProject?.assets.first(where: {
                  $0.id == selectedAssetID
                    && $0.kind == selectedAssetKind
                    && $0.reviewDecision != .rejected
              }) else {
            return filteredAssets.first
        }
        return selected
    }''', 1)
          store.write_text(text)

          persistence = Path('美术台/Services/ArtDepartmentV2Persistence.swift')
          text = persistence.read_text()
          if 'import FoundationXML' not in text:
              text = text.replace('import Foundation\n', 'import Foundation\nimport FoundationXML\n', 1)
          persistence.write_text(text)
          PY

      - name: Parse and assert V2 product path
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '美术台/Models/ArtDepartmentV2Models.swift'
            '美术台/Services/ArtDepartmentV2Persistence.swift'
            '美术台/Services/ArtDepartmentV2Clients.swift'
            '美术台/Services/ArtDepartmentV2Pipeline.swift'
            '美术台/Stores/ArtDepartmentV2Store.swift'
            '美术台/Views/ArtDepartmentV2Views.swift'
            '美术台/Views/ArtDepartmentV2SettingsView.swift'
            '美术台/ContentView.swift'
            '美术台/App/MyApp.swift'
            '美术台Tests/ArtDepartmentV2Tests.swift'
          )
          for file in "${files[@]}"; do swiftc -frontend -parse "$file"; done
          grep -q 'ArtDepartmentV2RootView' '美术台/ContentView.swift'
          grep -q 'coveredSourceUnitIDs' '美术台/Services/ArtDepartmentV2Pipeline.swift'
          grep -q 'source.contains(evidence)' '美术台/Services/ArtDepartmentV2Pipeline.swift'
          grep -q 'ArkImageGenerationClient' '美术台/Services/ArtDepartmentV2Clients.swift'
          grep -q 'isPromptLocked' '美术台/Models/ArtDepartmentV2Models.swift'
          test -f docs/ART_DEPARTMENT_V2_ARCHITECTURE.md
          test -f docs/EXTRACTION_ACCURACY_CONTRACT.md
          test -f docs/STYLE_PROMPT_VAULT.md
          test -f docs/API_CONFIGURATION_V2.md
          git diff --check

      - name: Commit clean production branch
        shell: bash
        run: |
          rm -f .github/workflows/validate-art-department-v2.yml
          rm -f .github/workflows/finalize-art-department-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            '美术台/Models/ArtDepartmentV2Models.swift' \
            '美术台/Services/ArtDepartmentV2Persistence.swift' \
            '美术台/Services/ArtDepartmentV2Clients.swift' \
            '美术台/Services/ArtDepartmentV2Pipeline.swift' \
            '美术台/Stores/ArtDepartmentV2Store.swift' \
            '美术台/Views/ArtDepartmentV2Views.swift' \
            '美术台/Views/ArtDepartmentV2SettingsView.swift' \
            '美术台/ContentView.swift' \
            '美术台/App/MyApp.swift' \
            '美术台Tests/ArtDepartmentV2Tests.swift' \
            README.md docs \
            .github/workflows/validate-art-department-v2.yml \
            .github/workflows/finalize-art-department-v2.yml
          git commit -m 'feat: finalize evidence-first art department v2'
          git push origin HEAD:feature/art-department-v2
