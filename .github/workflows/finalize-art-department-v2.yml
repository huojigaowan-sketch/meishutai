name: Finalize Art Department V2 refactor

on:
  push:
    branches:
      - feature/art-department-v2
    paths:
      - .github/workflows/finalize-art-department-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/art-department-v2
          fetch-depth: 0

      - name: Apply deterministic integration fixes
        run: python3 scripts/finalize_art_department_v2.py

      - name: Parse and assert V2 product path
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '美术台/Models/ArtDepartmentV2Models.swift'
            '美术台/Services/ArtDepartmentV2Persistence.swift'
            '美术台/Services/ArtDepartmentV2Clients.swift'
            '美术台/Services/ArtDepartmentV2Pipeline.swift'
            '美术台/Stores/ArtDepartmentV2Store.swift'
            '美术台/Views/ArtDepartmentV2Views.swift'
            '美术台/Views/ArtDepartmentV2SettingsView.swift'
            '美术台/ContentView.swift'
            '美术台/App/MyApp.swift'
            '美术台Tests/ArtDepartmentV2Tests.swift'
          )
          for file in "${files[@]}"; do swiftc -frontend -parse "$file"; done
          grep -q 'ArtDepartmentV2RootView' '美术台/ContentView.swift'
          grep -q 'coveredSourceUnitIDs' '美术台/Services/ArtDepartmentV2Pipeline.swift'
          grep -q 'source.contains(evidence)' '美术台/Services/ArtDepartmentV2Pipeline.swift'
          grep -q 'ArkImageGenerationClient' '美术台/Services/ArtDepartmentV2Clients.swift'
          grep -q 'isPromptLocked' '美术台/Models/ArtDepartmentV2Models.swift'
          test -f docs/ART_DEPARTMENT_V2_ARCHITECTURE.md
          test -f docs/EXTRACTION_ACCURACY_CONTRACT.md
          test -f docs/STYLE_PROMPT_VAULT.md
          test -f docs/API_CONFIGURATION_V2.md
          git diff --check

      - name: Commit clean production branch
        shell: bash
        run: |
          rm -f .github/workflows/validate-art-department-v2.yml
          rm -f .github/workflows/finalize-art-department-v2.yml
          rm -f scripts/finalize_art_department_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize evidence-first art department v2'
          git push origin HEAD:feature/art-department-v2
