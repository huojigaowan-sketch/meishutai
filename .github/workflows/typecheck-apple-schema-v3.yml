name: Typecheck Apple automated extraction v3

on:
  push:
    branches: [feature/art-department-v2]
    paths:
      - .github/workflows/typecheck-apple-schema-v3.yml

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/art-department-v2

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Build application without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/meishutai-build.log

      - name: Run unit tests without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee /tmp/meishutai-tests.log

      - name: Remove temporary typecheck workflow
        shell: bash
        run: |
          rm .github/workflows/typecheck-apple-schema-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/typecheck-apple-schema-v3.yml
          git commit -m 'chore: complete macOS Apple schema typecheck'
          git push origin HEAD:feature/art-department-v2
