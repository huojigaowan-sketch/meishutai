name: Typecheck Apple automated extraction v3

on:
  push:
    branches: [feature/art-department-v2]
    paths:
      - .github/workflows/typecheck-apple-schema-v3.yml
      - '美术台/**'
      - '美术台Tests/**'

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/art-department-v2

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Remove obsolete V1 implementation from the synchronized target
        shell: bash
        run: |
          set -euo pipefail
          find '美术台/Models' -type f ! -name 'ArtDepartmentV2Models.swift' -delete
          find '美术台/Services' -type f \
            ! -name 'AppleStructuredExtractionEngine.swift' \
            ! -name 'ArtDepartmentV2Clients.swift' \
            ! -name 'ArtDepartmentV2Persistence.swift' \
            ! -name 'ArtDepartmentV2Pipeline.swift' \
            -delete
          find '美术台/Stores' -type f ! -name 'ArtDepartmentV2Store.swift' -delete
          find '美术台/Views' -type f \
            ! -name 'ArtDepartmentV2Views.swift' \
            ! -name 'ArtDepartmentV2SettingsView.swift' \
            -delete
          find '美术台Tests' -type f ! -name 'ArtDepartmentV2Tests.swift' -delete

      - name: Align implementation with the installed Apple SDK
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('美术台/Services/AppleStructuredExtractionEngine.swift')
          text = path.read_text()
          text = text.replace(
              'GenerationOptions(samplingMode: .greedy)',
              'GenerationOptions(sampling: .greedy)'
          )
          old_signature = '''    func signature(for imageData: Data) async throws -> AppleStyleVisionSignature {
        let request = GenerateImageFeaturePrintRequest()
        let observations = try await request.perform(on: imageData)
        guard let first = observations.first else {
            throw ArtDepartmentV2Error.imageDataMissing
        }
        return AppleStyleVisionSignature(
            featurePrintBase64: first.data.base64EncodedString(),
            elementCount: first.elementCount
        )
    }

    func distance(between lhs: Data, and rhs: Data) async throws -> Double {
        let request = GenerateImageFeaturePrintRequest()
        async let firstResult = request.perform(on: lhs)
        async let secondResult = request.perform(on: rhs)
        guard let first = try await firstResult.first,
              let second = try await secondResult.first else {
            throw ArtDepartmentV2Error.imageDataMissing
        }
        return try first.distance(to: second)
    }'''
          new_signature = '''    func signature(for imageData: Data) async throws -> AppleStyleVisionSignature {
        let observation = try await GenerateImageFeaturePrintRequest().perform(on: imageData)
        return AppleStyleVisionSignature(
            featurePrintBase64: observation.data.base64EncodedString(),
            elementCount: observation.elementCount
        )
    }

    func distance(between lhs: Data, and rhs: Data) async throws -> Double {
        async let lhsObservation = GenerateImageFeaturePrintRequest().perform(on: lhs)
        async let rhsObservation = GenerateImageFeaturePrintRequest().perform(on: rhs)
        let (first, second) = try await (lhsObservation, rhsObservation)
        return try first.distance(to: second)
    }'''
          if old_signature not in text:
              raise SystemExit('Vision API replacement anchor not found')
          path.write_text(text.replace(old_signature, new_signature))
          PY

      - name: Build application without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/meishutai-build.log

      - name: Run unit tests without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project '美术台.xcodeproj' \
            -scheme '美术台' \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee /tmp/meishutai-tests.log

      - name: Commit production-only source tree
        shell: bash
        run: |
          rm .github/workflows/typecheck-apple-schema-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            '美术台/Models' \
            '美术台/Services' \
            '美术台/Stores' \
            '美术台/Views' \
            '美术台Tests' \
            '.github/workflows/typecheck-apple-schema-v3.yml'
          git commit -m 'refactor: remove obsolete manual-review implementation'
          git push origin HEAD:feature/art-department-v2
